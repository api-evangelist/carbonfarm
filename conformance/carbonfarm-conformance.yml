summary: >-
  Standards posture split across two systems. The identity layer is strong because it is Auth0
  (OIDC + RFC 8414 discovery, PKCE, DPoP algs advertised). The content API is weak on
  API-hygiene standards: no RFC 9457 errors, no RFC 9116 security.txt, no RFC 8594 deprecation
  signalling, no standard rate-limit headers. No compliance certification of any kind is
  published, so no `Compliance` pointer is emitted.
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    openapi/carbonfarm-cms-openapi.json declares openapi 3.0.1 with 14 operations, unique
    operationIds and declared securitySchemes. Auto-generated by Directus 10.10.7 at
    /server/specs/oas, not authored as a published contract.
- id: graphql
  conforms: true
