sector_standards:
  note: >-
    CarbonFarm's marketing and press describe work against carbon/MRV methodologies — Gold
    Standard dMRV for rice, the Sustainable Rice Platform (SRP) standard, and LSRS traceability
    guidance. Those are METHODOLOGY conformance claims about carbon projects, not API standards,
    and none of them is expressed in any machine-readable artifact the company publishes. They
    are recorded here as context and deliberately NOT asserted as API conformance.
  claims:
