summary: >-
  CarbonFarm's CMS projects one content core through two surfaces — a Directus REST API and a
  Directus GraphQL API — and they are NOT identical. GraphQL adds aggregation and realtime
  subscriptions that REST does not expose; REST adds asset delivery and the whole auth surface
  that GraphQL does not. The MCP column is a derived candidate: CarbonFarm operates no MCP server.
