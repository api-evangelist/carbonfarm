graphql_only:
- field: post_aggregated
  reason: >-
    groupBy/count aggregation over posts. No REST operation performs aggregation — the REST side
    can only return counts via the opt-in `meta` object (total_count/filter_count).
- field: post_by_version
  reason: >-
    Returns a `version_post` for a named content version. REST exposes a `version` query
    parameter on the single-item read, so the capability overlaps but the typed
    version-object return has no REST analogue.
- field: 'Subscription.post_mutated(event: create|update|delete)'
  reason: >-
    Realtime WebSocket subscription. REST has no polling-free equivalent and CarbonFarm publishes
    no AsyncAPI and no webhooks, so this capability is invisible outside the SDL.
- field: 'Subscription.directus_files_mutated(event: create|update|delete)'
  reason: Realtime file mutation stream; no REST or webhook equivalent.
