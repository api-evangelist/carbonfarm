  note: >-
    Organization-scoped login: app.carbonfarm.tech redirects with
    `organization=org_PyIwqJe0CACfELBB&organization_name=carbonfarm`, so access is bound to an
    Auth0 organization — a tenant must exist before a login can succeed. The scope set is Auth0's
    default OIDC claim set, not an API permission model; no resource-server scopes are advertised,
    and /.well-known/oauth-protected-resource returns 404. That is why no `scopes/` artifact was
    written — there is no API scope surface to record, only OIDC identity claims.
