  note: >-
    Two distinct authentication surfaces, and they belong to different systems. The CMS content
    API authenticates with a Directus static token or session bearer token; the client platform
    authenticates humans through CarbonFarm's Auth0 tenant. Neither is documented publicly —
    everything below was read off machine-readable endpoints the company serves anonymously.
schemes:
- name: KeyAuth
  type: apiKey
  in: query
  parameter: access_token
  sources:
  - openapi/carbonfarm-cms-openapi.json
  note: >-
    Directus static access token passed as a query parameter. Directus' own guidance is to prefer
    the header form; a token in a query string lands in access logs and Referer headers.
- name: Auth
  type: apiKey
  in: header
  parameter: Authorization
  sources:
