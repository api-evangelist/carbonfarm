apis:
- name: CarbonFarm CMS Content API
  description: >-
    The Directus 10.10.7 headless CMS that serves carbonfarm.tech's news posts and image assets.
    It publishes a real OpenAPI 3.0.1 (14 operations) and a full GraphQL SDL anonymously at
    /server/specs/oas and /server/specs/graphql, but both are auto-generated from the live schema
    rather than authored as a developer contract, and the data operations return HTTP 403 to
    anonymous callers. This is internal website infrastructure, NOT CarbonFarm's rice MRV product
    API — the content model is two entities (post, directus_files) and contains no paddy,
    emissions, project or carbon-credit data. Recorded because it is the only machine-readable
    contract the company publishes; it is not a product CarbonFarm sells or supports.
  baseURL: https://cms.int.carbonfarm.app
  tags:
  - Content Management
  - GraphQL
  properties:
  - type: OpenAPI
    url: openapi/carbonfarm-cms-openapi.json
  - type: GraphQL
    url: graphql/carbonfarm-cms-schema.graphql
  - type: Overlay
    url: overlays/carbonfarm-cms-overlay.yaml
  x-humanurl-reason: >-
    humanURL is deliberately omitted. There is no human-readable page for this API anywhere — no
    docs, no reference, and the Directus admin app at /admin returns 404. Pointing humanURL at the
    marketing news page would assert documentation that does not exist.
  x-ownership-evidence: >-
    The spec's servers[] names cms.int.carbonfarm.app (the fetch host); /server/info reports
    project_name "CarbonFarm CMS"; the host is a subdomain of carbonfarm.app, which also serves
    CarbonFarm's client login (web-login.carbonfarm.app) and portal (portal.carbonfarm.app); and
    carbonfarm.tech loads its post images from cms.int.carbonfarm.app/assets/.
