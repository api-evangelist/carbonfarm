aid: carbonfarm
name: CarbonFarm
description: >-
  CarbonFarm Technology is a French climate-tech company (registered in Nanterre, SIREN 912160389)
  that uses satellite imagery and proprietary machine-learning models to monitor, measure and
  verify greenhouse-gas reductions in rice production. Rice accounts for roughly 12% of global
  methane emissions, and practices such as Alternate Wetting and Drying can cut paddy methane
  substantially — but conventional MRV depends on self-declared practices recorded in paper
  logbooks, which is expensive to collect from smallholders and open to fraud. CarbonFarm detects
  water-management and straw-management practices remotely at paddy level, estimates baseline and
  project emissions with validated models, and verifies additionality, at a fraction of the cost
  of ground-based MRV. Customers and partners named publicly include Mars Food, Tilda, Beneo, Amru
  Rice, Vida Energy, Fortune Rice, Ostrom Climate, Core Carbon X, the Sustainable Rice Platform,
  UNDP, Danone, Rikolto, Cornell University, IRRI and Regrow Ag. CarbonFarm operates no developer
  program: there is no developer portal, API reference, SDK or public API product, and the client
  platform sits behind an Auth0 organization login. The one machine-readable contract it publishes
  is the Directus headless CMS behind its marketing website.
