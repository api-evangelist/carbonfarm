x-pointers-deliberately-withheld:
  note: >-
    These artifacts exist on disk or were probed, but no canonical pointer is emitted because the
    pointer would assert something CarbonFarm does not publish. Recorded so a later pass does not
    "fix" the omission.
  withheld:
  - {type: MCPServer, reason: 'mcp/carbonfarm-mcp.yml is a DERIVED candidate with deployment.mode = none. CarbonFarm ships no hosted endpoint and no stdio package.'}
  - {type: AgentCard, reason: '/.well-known/agent-card.json and /.well-known/agent.json return 404 or 301 on every host. Never generated.'}
  - {type: SecurityTxt, reason: 'No security.txt on any host (404 everywhere).'}
  - {type: Idempotency, reason: 'Zero idempotency support — no Idempotency-Key on any of the 14 operations, no "idempoten" match in the spec.'}
  - {type: Compliance, reason: 'No certifications, no compliance page, no trust center. A privacy policy is not a compliance program.'}
  - {type: TrustCenter, reason: 'probe-security-programs.py returned trust=none.'}
  - {type: Security, reason: 'No vulnerability disclosure policy, no bug bounty, no security@ contact published. probe returned vdp=none.'}
  - {type: StatusPage, reason: 'No status page. carbonfarm.statuspage.io is unclaimed and 302s to statuspage.io itself.'}
  - {type: Deprecation, reason: 'No deprecation policy, no Sunset/Deprecation header, no API versioning scheme at all.'}
  - {type: ChangeLog, reason: 'carbonfarm.tech/posts is company news, not an API changelog. Wired as Blog.'}
  - {type: SDKs, reason: 'No first-party client library in any registry — npm, PyPI, RubyGems and crates.io all return nothing for "carbonfarm".'}
  - {type: Packages, reason: 'Same — no packages exist to catalogue.'}
  - {type: AsyncAPI, reason: 'No AsyncAPI published. GraphQL subscriptions exist in the SDL and are recorded there as evidence, not promoted to an event contract.'}
  - {type: Webhooks, reason: 'No webhooks documented anywhere.'}
  - {type: Pricing, reason: 'No pricing page (/pricing, /plans, /price all 404).'}
  - {type: TermsOfService, reason: 'No terms of service published; the /legal page carries a privacy policy and a stakeholder consultation document only.'}
  - {type: SignUp, reason: 'No self-serve sign-up (/signup, /register 404). Login is wired instead.'}
  - {type: Documentation, reason: 'No documentation of any kind exists.'}
  - {type: DeveloperPortal, reason: '/developers and /api return 404. No developer portal.'}
  - {type: APIReference, reason: 'No API reference exists.'}
  - {type: GettingStarted, reason: 'No getting-started or quickstart page.'}
  - {type: Roadmap, reason: 'No public roadmap.'}
  - {type: Postman, reason: 'No public Postman collection or workspace found.'}
  - {type: Sandbox, reason: 'No sandbox, test mode, or test credentials published.'}
  - {type: CLI, reason: 'No first-party CLI.'}
  - {type: OAuthScopes, reason: 'The Auth0 tenant advertises only the default OIDC claim scopes, not an API permission model, and /.well-known/oauth-protected-resource is 404. Recorded inside authentication/ instead of forcing an empty scopes artifact.'}
