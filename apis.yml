x-coverage:
  state: covered
  detail: >-
    STEP 0b contract discovery beat the marketing site. A first-round "no spec" verdict would have
    been wrong: a live OpenAPI 3.0.1 and a full GraphQL SDL are published anonymously by
    CarbonFarm's Directus CMS at cms.int.carbonfarm.app — a host found by following the image URLs
    on carbonfarm.tech and by DNS enumeration after crt.sh returned 502. The rice MRV product API
    remains gated behind an Auth0 organization login at app.carbonfarm.tech, which 301s every path.
  checked: '2026-08-17'
